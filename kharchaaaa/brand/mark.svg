<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kharchaaaa">
  <title>Kharchaaaa</title>
  <!--
    The mark is the product itself: a dial with a ceiling.
    Faint ring   = the month's budget, all of it
    Accent arc   = what you have already spent
    Bead         = where you are right now
    Gap at top   = the room you have left

    The k is drawn as strokes, not type, so the logo renders identically
    with no fonts installed anywhere.
  -->
  <rect width="512" height="512" fill="#060606"/>
  <g transform="translate(256,256)">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="30"/>
    <path d="M 26 -147.7 A 150 150 0 1 1 -150 0"
          fill="none" stroke="#00FF94" stroke-width="30"/>
    <circle cx="-150" cy="0" r="26" fill="#00FF94"/>
    <g fill="none" stroke="#f0ede8" stroke-width="22" stroke-linecap="round">
      <path d="M -34 -92 L -34 92"/>
      <path d="M 30 -26 L -28 22"/>
      <path d="M -28 22 L 34 92"/>
    </g>
  </g>
</svg>
